name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate Alembic migration
        shell: bash
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: alembic -c alembic.ini upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password
        run: docker compose config
      - name: Build production-like images
        run: docker compose build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
